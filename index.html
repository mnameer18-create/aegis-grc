function assistant(){return header('✦ NOVENTRA INTELLIGENCE','How can I help?','Live LLM responses through the protected Supabase → n8n → OpenAI path.')+'<div class="glass panel" style="margin-top:17px"><div class="minirow"><div style="display:flex;align-items:center;gap:12px"><div class="orb mini"></div><div><strong>Noventra</strong><div class="muted">Intelligence assistant · Live model response</div></div></div><span class="pill green">Live AI</span></div><div class="suggestions"><button data-question="Which compliance areas should be reviewed for a new e-money product in Malaysia?">New e-money product review</button><button data-question="What should a compliance officer assess when BNM issues a new regulatory circular?">New regulatory circular</button><button data-question="What evidence should support closure of a compliance remediation action?">Remediation evidence</button></div><div style="margin-top:19px">'+askForm()+'</div></div>'+(state.aiLoading?'<div class="glass chatanswer"><div class="kicker">✦ NOVENTRA IS ANALYSING</div><p class="muted">Sending your question through the protected AI gateway…</p></div>':state.answer?'<div class="glass chatanswer"><div class="kicker">✦ NOVENTRA RESPONSE <span class="pill green">LIVE LLM</span></div><p style="font-size:15px;line-height:1.8;white-space:pre-wrap">'+esc(state.answer)+'</p><div class="cite"><b>Regulatory grounding status</b><br>'+(state.answerMeta&&state.answerMeta.regulatory_sources_verified?'Verified source retrieval reported by backend.':'No verified regulatory-source retrieval in this phase. Treat the response as general guidance and require human review.')+'</div></div>':'')}function reviews(){let arr=state.records.map((r,i)=>({...r,index:i})).filter(r=>state.tab==='All'||r.status===state.tab);return header('REGULATORY INTELLIGENCE','Clarity, backed by evidence.','See the original requirement, the internal policy and the proposed finding side by side.')+'<div class="toolbar" style="margin-top:26px"><div class="selector" style="margin:0">'+['All','Review required','Confirmed','Clarification requested'].map(t=>'<button class="'+(state.tab===t?'sel':'')+'" data-tab="'+esc(t)+'">'+esc(t)+'</button>').join('')+'</div>'+button('New assessment','new','small')+'</div><section class="rows" style="margin-top:19px">'+(arr.length?arr.map(r=>finding(r,r.index)).join(''):'<div class="glass empty">No findings in this view.</div>')+'</section><div class="glass panel" style="margin-top:19px"><div class="kicker">✦ REGULATORY INGESTION</div><p class="muted">The next technical milestone connects verified PDF ingestion, AI extraction and approved document versions. This shareable v0.3 demo does not send documents to an AI provider.</p>'+button('Register a document','adddoc','small')+'</div>'}
function review(){const x=record();if(!x)return reviews();return header('DECISION STUDIO / '+esc(x.id),'Review the evidence.','Make one considered decision at a time. Noventra proposes; the authorised officer decides.')+'<div class="toolbar" style="margin:24px 0 14px"><span class="pill '+(x.status==='Review required'?'amber':'green')+'">'+esc(x.status)+'</span>'+button('← All findings','reviews','small')+'</div><h2 style="font-size:25px;letter-spacing:-.7px">'+esc(x.title)+'</h2><p class="muted">'+esc(x.topic)+' · '+esc(x.owner)+' · Target '+esc(x.due)+'</p><div class="reviewgrid" style="margin-top:21px"><div class="glass doc"><div class="label">▤ Regulatory reference · Fictional</div><h4>'+esc(x.source)+'</h4><span class="pill">'+esc(x.clause)+'</span><p>'+esc(x.requirement)+'</p></div><div class="glass doc"><div class="label">▤ Internal control · Synthetic</div><h4>'+esc(x.policy)+'</h4><p>'+esc(x.policyBody)+'</p></div></div><div class="glass compare"><div class="kicker">✦ NOVENTRA PROPOSED FINDING · SIMULATED</div><h3>Possible policy gap</h3><p style="font-size:14px;line-height:1.8;color:#526981">'+esc(x.gap)+'</p><div class="pill amber">Human verification required</div><p class="muted">No validated BNM reference, live AI analysis or regulatory conclusion is represented by this demo.</p><div class="btnbar">'+button('Confirm finding','confirm','primary')+button('Request clarification','clarify')+button('Create action','makeaction')+button('Next →','next')+'</div></div>'}
function actions(){return header('GAPS & ACTIONS','From insight to resolution.','Every action has an owner, target date and human-reviewed outcome.')+'<div class="toolbar" style="margin-top:24px"><span class="pill">'+state.actions.length+' total actions</span>'+button('+ New action','newaction','small')+'</div><div class="glass panel" style="margin-top:16px">'+(state.actions.length?state.actions.map((a,i)=>'<div class="minirow" style="border-bottom:1px solid #e0e9ef;padding:12px 0"><div><b>'+esc(a.title)+'</b><p class="muted">'+esc(a.owner)+' · Due '+esc(a.due)+' · Linked '+esc(a.linked)+'</p><span class="pill">'+esc(a.status)+'</span></div><div>'+button(a.status==='Closed'?'Reopen':'Close','toggleaction:'+i,'small')+'</div></div>').join(''):'<div class="empty">No remediation actions yet. Open a review and create one from a proposed finding.</div>')+'</div>'}
function library(){const samples=state.records.flatMap((x,i)=>[{name:x.source,type:'Regulatory source',id:i},{name:x.policy,type:'Internal policy',id:i}]);return header('KNOWLEDGE LIBRARY','One source of truth.','Every answer should be grounded in the correct document, its version and supporting evidence.')+'<div class="toolbar" style="margin-top:23px"><span class="pill">'+(samples.length+state.library.length)+' registered references</span>'+button('+ Register document','adddoc','small')+'</div><div class="glass panel" style="margin-top:17px">'+samples.map(x=>'<div class="minirow" style="padding:11px 0;border-bottom:1px solid #e3eaf2"><div><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.type)+' · Fictional sample</div></div>'+button('View comparison','select:'+x.id,'small')+'</div>').join('')+state.library.map(x=>'<div class="minirow"><div><b>'+esc(x.name)+'</b><div class="muted">Registered manually · No file uploaded</div></div><span class="pill">Demo</span></div>').join('')+'</div>'}
function history(){return header('GOVERNANCE & TRACEABILITY','Every decision matters.','A transparent history of what people decided, and why.')+'<div class="glass panel" style="margin-top:24px"><div class="paneltitle">Decision history · Browser-local simulation</div>'+(state.history.length?state.history.map(x=>'<div class="historyitem"><b>'+esc(x.text)+'</b><div class="muted">'+esc(x.date)+'</div></div>').join(''):'<div class="empty">No decisions recorded yet. Open Decision Studio to review a finding.</div>')+'</div><p class="muted" style="margin-top:13px">A production audit trail requires authenticated users, server-side append-only records and tamper-resistant storage. Browser-local records are not an audit trail.</p>'}
function report(){const pending=state.records.filter(x=>x.status==='Review required').length;return header('REPORTING & OVERSIGHT','The complete picture.','A calm, concise view for senior management and Compliance leaders.')+'<div class="signalgrid" style="margin-top:27px"><div class="glass signal"><div class="sym">▤</div><span class="value">'+state.records.length+'</span><strong>Tracked assessments</strong></div><div class="glass signal"><div class="sym">◇</div><span class="value">'+pending+'</span><strong>Awaiting decisions</strong></div><div class="glass signal"><div class="sym">✓</div><span class="value">'+state.actions.length+'</span><strong>Recorded actions</strong></div></div><div class="glass panel" style="margin-top:20px"><div class="minirow"><b>Assessment summary</b>'+button('Export CSV','export','small')+'</div>'+state.records.map(x=>'<div class="minirow"><span style="font-size:12px">'+esc(x.title)+'</span><span class="pill">'+esc(x.status)+'</span></div>').join('')+'</div>'}
function workspace(){return header('CONNECTED OVERSIGHT','One intelligent platform.','Additional workspaces are planned as part of the client’s broader Compliance operating model.')+'<div class="signalgrid" style="margin-top:24px">'+[['Compliance assurance','Testing, monitoring and guidance'],['Advice & incidents','Product assessments and breach triage'],['Customer & AML oversight','Complaint trends and AML exceptions'],['Reporting & submissions','Management packs and submission controls']].map(x=>'<div class="glass panel"><div class="bubble">✧</div><h3>'+x[0]+'</h3><p class="muted">'+x[1]+'</p><span class="pill">Planned functionality</span></div>').join('')+'</div>'}
const pages={home,assistant,reviews,review,actions,library,history,report,workspace};
function dock(){const links=[['home','⌂','Home'],['assistant','✧','Intelligence'],['reviews','◇','Reviews'],['actions','◷','Actions'],['library','▤','Library'],['report','▥','Reports'],['workspace','☷','More']];byId('dock').innerHTML=links.map(([p,icon,name],i)=>'<button data-page="'+p+'" class="'+(state.page===p||(state.page==='review'&&p==='reviews')?'active':'')+'" title="'+name+'" aria-label="'+name+'"><span class="glyph">'+icon+'</span><span class="docktext">'+name+'</span></button>'+ (i===1?'<div class="separator"></div>':'' )).join('')}
function render(){renderAuthGate();if(!state.userEmail)return;byId('view').innerHTML=(pages[state.page]||home)();dock();byId('overlay').innerHTML=state.sheet?sheet():''}
function sheet(){const head='<div class="sheetback" data-dismiss="1"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>';if(state.sheet==='new')return head+'<h2>New compliance assessment</h2><p class="muted">Register a synthetic finding in this demo.</p><form id="new-form"><label class="field">Title<input name="title" required maxlength="100" placeholder="e.g. Review of new policy requirement"></label><label class="field">Source reference<input name="source" required maxlength="120" placeholder="Demo source title"></label><label class="field">Potential gap<textarea name="gap" required maxlength="500" placeholder="What needs checking?"></textarea></label><div class="btnbar"><button class="btn primary" type="submit">Create assessment</button>'+button('Cancel','dismiss')+'</div></form></div></div>';if(state.sheet==='adddoc')return head+'<h2>Register a reference</h2><p class="muted">This demo stores document names only. It does not upload or process any files.</p><form id="doc-form"><label class="field">Document title<input name="name" maxlength="120" required placeholder="e.g. Example Policy v1"></label><div class="btnbar"><button class="btn primary" type="submit">Register</button>'+button('Cancel','dismiss')+'</div></form></div></div>';if(state.sheet==='newaction')return head+'<h2>Create an action</h2><form id="action-form"><label class="field">Action title<input name="title" required maxlength="120"></label><label class="field">Owner<input name="owner" required maxlength="90"></label><label class="field">Target date<input name="due" type="date" required value="2026-12-01"></label><div class="btnbar"><button class="btn primary" type="submit">Create action</button>'+button('Cancel','dismiss')+'</div></form></div></div>';return ''}
function log(text){state.history.unshift({text,date:new Date().toLocaleString()});persist()}
function act(v){if(v.startsWith('select:')){state.selected=Number(v.split(':')[1]);state.page='review'}else if(v.startsWith('toggleaction:')){const a=state.actions[Number(v.split(':')[1])];if(a){a.status=a.status==='Closed'?'Open':'Closed';log('Action '+a.status.toLowerCase()+': '+a.title);toast('Action updated')}}else if(v==='confirm'||v==='clarify'){const x=record();if(x){x.status=v==='confirm'?'Confirmed':'Clarification requested';log(x.id+' — '+x.status);toast('Decision saved locally')}}else if(v==='makeaction'){const x=record();if(x){state.actions.push({title:'Remediate: '+x.title,owner:x.owner,due:x.due,status:'Open',linked:x.id});log('Remediation action created for '+x.id);toast('Action created');state.page='actions'}}else if(v==='next'){state.selected=(state.selected+1)%state.records.length}else if(v==='export'){const rows=[['ID','Title','Priority','Status','Owner'],...state.records.map(r=>[r.id,r.title,r.priority,r.status,r.owner])];const csv=rows.map(row=>row.map(s=>'"'+String(s).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='aegis-demo-assessments.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('CSV export created')}else if(['new','adddoc','newaction'].includes(v)){state.sheet=v}else if(v==='dismiss'){state.sheet=null}else if(pages[v]){state.page=v}persist();render()}
async function restoreAuth(){
  if(!supabaseClient){state.authReady=true;render();return}
  try{
    const {data:{session}}=await supabaseClient.auth.getSession();
    state.userEmail=session?.user?.email||'';
  }catch{}
  state.authReady=true;render();
}
async function answer(q){
  state.question=q;state.answer='';state.answerMeta=null;state.page='assistant';
  if(!supabaseClient){state.answer='Live AI is not configured yet. Add the Supabase publishable key to this Phase 2 branch.';render();return}
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(!session){state.answer='Please sign in to use live Noventra AI.';render();return}
  state.aiLoading=true;render();
  try{
    const response=await fetch(NOVENTRA_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_PUBLISHABLE_KEY,'Authorization':'Bearer '+session.access_token},body:JSON.stringify({question:q})});
    const result=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(result.error||('Gateway returned HTTP '+response.status));
    if(typeof result.answer!=='string'||!result.answer.trim())throw new Error('No valid AI answer returned');
    state.answer=result.answer.trim();state.answerMeta=result;
  }catch(err){
    state.answer='Live Noventra AI could not respond: '+(err&&err.message?err.message:'Unknown error');
  }finally{
    state.aiLoading=false;render();
  }
}
document.addEventListener('click',async e=>{const a=e.target.closest('[data-action]');if(a){if(a.dataset.action==='signout'){if(supabaseClient)await supabaseClient.auth.signOut();state.userEmail='';state.answer='';state.answerMeta=null;state.page='home';render();return}act(a.dataset.action);return}const p=e.target.closest('[data-page]');if(p){state.page=p.dataset.page;state.sheet=null;render();return}const s=e.target.closest('[data-select]');if(s){act('select:'+s.dataset.select);return}const t=e.target.closest('[data-tab]');if(t){state.tab=t.dataset.tab;render();return}const q=e.target.closest('[data-question]');if(q){answer(q.dataset.question);return}if(e.target.dataset.dismiss){state.sheet=null;render()}});
document.addEventListener('submit',async e=>{const f=e.target;if(!['ask-form','login-form','new-form','doc-form','action-form'].includes(f.id))return;e.preventDefault();const d=new FormData(f);if(f.id==='login-form'){if(!supabaseClient){toast('Supabase is not configured');return}const email=String(d.get('email')||'').trim(),password=String(d.get('password')||'');const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){toast(error.message);return}state.userEmail=data.user?.email||email;state.answer='';state.page='home';render();toast('Signed in');return}if(f.id==='ask-form'){const q=String(d.get('question')||'').trim();if(q)answer(q);return}if(f.id==='new-form'){const title=String(d.get('title')||'').trim(),source=String(d.get('source')||'').trim(),gap=String(d.get('gap')||'').trim();state.records.push({id:'A-'+(1050+state.records.length),title,topic:'New assessment',priority:'Medium',source,clause:'Unverified source',requirement:'To be confirmed by Compliance',policy:'Not yet mapped',policyBody:'No evidence supplied',gap,owner:'Compliance',status:'Review required',due:'Not set'});log('Assessment created: '+title);toast('Assessment created')}if(f.id==='doc-form'){const name=String(d.get('name')||'').trim();state.library.push({name});log('Document reference registered: '+name);toast('Reference registered')}if(f.id==='action-form'){const title=String(d.get('title')||'').trim();state.actions.push({title,owner:String(d.get('owner')||''),due:String(d.get('due')||''),linked:'Manual action',status:'Open'});log('Action created: '+title);toast('Action created')}state.sheet=null;persist();render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.sheet){state.sheet=null;render()}});if(supabaseClient)supabaseClient.auth.onAuthStateChange((_event,session)=>{state.userEmail=session?.user?.email||'';if(!state.userEmail)state.page='home';render()});render();restoreAuth();
})();
</script></body></html>
